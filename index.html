<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ProjectApp – Admin</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <h2>ProjectApp – Admin</h2>

    <div id="authCard" class="card">
      <div class="row">
        <input id="email" placeholder="อีเมลผู้ดูแล" />
        <input id="password" type="password" placeholder="รหัสผ่าน" />
        <button id="btnSignIn">เข้าสู่ระบบ</button>
        <button id="btnSignOut">ออกจากระบบ</button>
      </div>
      <div class="row"><span id="me"></span></div>
      <div id="notAdmin" class="row">
        <span class="danger">บัญชีนี้ยังไม่เป็นผู้ดูแลระบบ</span>
        <button id="btnBootstrap">ฉันคือผู้ดูแลคนแรก</button>
      </div>
    </div>

    <div id="adminOnly" class="card">
  <div class="row row-between">
        <strong>จัดการผู้ใช้</strong>
        <div class="row">
          <button id="btnRefresh">รีเฟรช</button>
          <button id="btnPrev">ก่อนหน้า</button>
          <button id="btnNext">ถัดไป</button>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>อีเมล</th>
            <th>ชื่อ</th>
            <th>UID</th>
            <th>สิทธิ์</th>
            <th>ปล่อยเช่า</th>
            <th>สถานะปล่อยเช่า</th>
            <th>หมดอายุ</th>
            <th>สถานะ</th>
            <th>จัดการ</th>
            <th>รหัสผ่าน</th>
          </tr>
        </thead>
        <tbody id="users"></tbody>
      </table>
    </div>

    <div id="hostRequests" class="card hidden">
      <div class="row row-between">
        <strong>คำขอปล่อยเช่าที่จอด</strong>
        <div class="row">
          <button id="btnReqRefresh">รีเฟรช</button>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>อีเมล</th>
            <th>ชื่อ</th>
            <th>UID</th>
            <th>วันที่ขอ</th>
            <th>จัดการ</th>
          </tr>
        </thead>
        <tbody id="requests"></tbody>
      </table>
    </div>

    <!-- Firebase SDKs (module imports used in app.js) -->
    <script type="module" src="./app.js"></script>
  </body>
  </html>
