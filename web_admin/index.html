<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ProjectApp – Admin</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
  <!-- ส่วนโครงร่างหน้าแอดมิน -->
  <div class="container">
    <div class="row row-between">
      <h2>ProjectApp – Admin</h2>
      <div id="authArea" class="auth-area">
        <div id="authControls" class="row">
          <input id="email" class="input" placeholder="อีเมลผู้ดูแล" />
          <input id="password" class="input" type="password" placeholder="รหัสผ่าน" />
          <button id="btnSignIn" class="btn btn-primary">เข้าสู่ระบบ</button>
          <button id="btnSignOut" class="btn btn-outline">ออกจากระบบ</button>
        </div>
        <div class="row"><span id="me" class="muted"></span></div>
        <div id="notAdmin" class="row">
          <span class="danger">บัญชีนี้ยังไม่เป็นผู้ดูแลระบบ</span>
        </div>
      </div>
    </div>

  <!-- ส่วนเข้าสู่ระบบและสถานะผู้ใช้ -->
  <div id="authCard" class="card">
      <div class="row row-between">
        <!-- สลับแท็บ (ซ้าย) -->
        <div id="tabSwitcher" class="tabs hidden">
          <button id="tabUsers" class="tab active">จัดการผู้ใช้</button>
          <button id="tabRequests" class="tab">คำขอปล่อยเช่าที่จอด</button>
        </div>
      </div>
    </div>

  <!-- ส่วนจัดการผู้ใช้ -->
  <div id="adminOnly" class="card">
  <div class="row row-between">
        <strong>จัดการผู้ใช้</strong>
        <div class="row">
          <button id="btnRefresh" class="btn">รีเฟรช</button>
          <button id="btnPrev" class="btn">ก่อนหน้า</button>
          <button id="btnNext" class="btn">ถัดไป</button>
          <button id="btnBackfillRatings" class="btn">คำนวณคะแนนทั้งหมด</button>
          <button id="btnCleanupBookings" class="btn">ลบการจองที่ไม่ถูกต้อง</button>
        </div>
      </div>
      <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>อีเมล</th>
            <th>ชื่อ</th>
            <th>UID</th>
            <th>สิทธิ์</th>
            <th>ปล่อยเช่า</th>
            <th>สถานะปล่อยเช่า</th>
            <th>หมดอายุ</th>
            <th>สถานะ</th>
            <th>จัดการ</th>
            <th>รหัสผ่าน</th>
          </tr>
        </thead>
        <tbody id="users"></tbody>
      </table>
      </div>
    </div>

  <!-- // ส่วนคำขอปล่อยเช่า -->
  <div id="hostRequests" class="card hidden">
      <div class="row row-between">
        <strong>คำขอปล่อยเช่าที่จอด</strong>
        <div class="row">
          <button id="btnReqRefresh" class="btn">รีเฟรช</button>
        </div>
      </div>
      <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>อีเมล</th>
            <th>ชื่อ</th>
            <th>ชื่อ-นามสกุล</th>
            <th>เบอร์โทร</th>
            <th>สลิป</th>
            <th>UID</th>
            <th>วันที่ขอ</th>
            <th>จัดการ</th>
          </tr>
        </thead>
        <tbody id="requests"></tbody>
      </table>
      </div>
    </div>

    <!-- Modal แสดงรูปใหญ่ -->
    <div id="imgModal" class="modal hidden">
      <div class="modal-content">
        <span id="imgClose" class="modal-close">×</span>
        <img id="imgPreview" src="" alt="preview" />
      </div>
    </div>

  <!-- ส่วนสคริปต์ SDK ของ Firebase (import แบบ module ใช้ใน app.js) -->
    <script type="module" src="./app.js"></script>
    </div>
  </body>
  </html>
